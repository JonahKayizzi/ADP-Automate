spring:
  application:
    name: adp-automate
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/adp_automate}
    username: ${DATABASE_USER:adp}
    password: ${DATABASE_PASSWORD:adp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  timezone: Africa/Kampala

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ug.caa.adpautomate: DEBUG
