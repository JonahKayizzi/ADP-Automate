services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adp_automate
      POSTGRES_USER: adp
      POSTGRES_PASSWORD: adp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adp -d adp_automate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/adp_automate
      DATABASE_USER: adp
      DATABASE_PASSWORD: adp
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:8088
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
