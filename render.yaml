# Render Blueprint — optional one-click staging layout
# Dashboard: New → Blueprint → connect JonahKayizzi/ADP-Automate (dev branch)

databases:
  - name: adp-automate-db
    plan: free
    databaseName: adp_automate
    user: adp

services:
  - type: web
    name: adp-automate-api
    runtime: docker
    plan: free
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adp-automate-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads

  - type: web
    name: adp-automate-web
    runtime: static
    plan: free
    branch: dev
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
